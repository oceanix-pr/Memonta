name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MEMONTA_CI_DERIVED_DATA: ${{ runner.temp }}/memonta-ci/DerivedData
      TEST_RUNNER_MEMONTA_EPHEMERAL_TEST_ENCRYPTION: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check localization resources
        run: python3 Scripts/check_l10n.py

      - name: Prepare package binary frameworks before build planning
        run: |
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates \
            -project Memonta.xcodeproj -scheme Memonta \
            -derivedDataPath "$MEMONTA_CI_DERIVED_DATA"
          MEMONTA_PACKAGE_CACHE_PATH="$MEMONTA_CI_DERIVED_DATA/SourcePackages" \
            bash Scripts/fix_onnxruntime_framework.sh

      - name: Build
        run: >-
          xcodebuild
          -project Memonta.xcodeproj
          -scheme Memonta
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$MEMONTA_CI_DERIVED_DATA"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          DEVELOPMENT_TEAM=
          build

      - name: Run unit tests
        run: >-
          xcodebuild
          -project Memonta.xcodeproj
          -scheme Memonta
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$MEMONTA_CI_DERIVED_DATA"
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=
          ENABLE_HARDENED_RUNTIME=NO
          test -only-testing:MemontaTests
