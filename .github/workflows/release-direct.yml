name: Release direct distribution

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已提交版本对应的正式 tag，例如 v9.5.0'
        required: true
        type: string
      distribution:
        description: '分发方式；未公证方式仅用于已获用户同意的构建'
        required: true
        type: choice
        default: notarized
        options:
          - notarized
          - unnotarized-test

permissions:
  contents: read

concurrency:
  group: memonta-direct-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DISTRIBUTION_MODE: ${{ inputs.distribution || 'notarized' }}
    steps:
      - name: Validate release tag and key availability
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          required=(SPARKLE_PRIVATE_KEY)
          case "$DISTRIBUTION_MODE" in
            notarized)
              required+=(DEVELOPER_ID_P12_BASE64 NOTARY_API_KEY_P8 APPLE_TEAM_ID NOTARY_KEY_ID NOTARY_ISSUER_ID)
              ;;
            unnotarized-test) ;;
            *) echo '::error::未知分发方式。'; exit 1 ;;
          esac
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::请在 release 环境配置 $name。"
              exit 1
            fi
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Prepare tools and verify source
        run: |
          brew install xcodegen
          xcodegen generate
          python3 Scripts/check_l10n.py --quiet
      - name: Prepare package binary frameworks before build planning
        run: |
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates \
            -project Memonta.xcodeproj -scheme Memonta \
            -derivedDataPath "${RUNNER_TEMP}/memonta-release/DerivedData"
          MEMONTA_PACKAGE_CACHE_PATH="${RUNNER_TEMP}/memonta-release/DerivedData/SourcePackages" \
            bash Scripts/fix_onnxruntime_framework.sh
      - name: Run unit tests
        env:
          TEST_RUNNER_MEMONTA_EPHEMERAL_TEST_ENCRYPTION: '1'
        run: >-
          xcodebuild -skipPackageUpdates -project Memonta.xcodeproj -scheme Memonta
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath "${RUNNER_TEMP}/memonta-release/DerivedData"
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          ENABLE_HARDENED_RUNTIME=NO test -only-testing:MemontaTests
      - name: Import formal distribution credentials
        if: env.DISTRIBUTION_MODE == 'notarized'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          test -n "$CERTIFICATE" && test -n "$NOTARY_API_KEY"
          keychain="$RUNNER_TEMP/memonta-release.keychain-db"
          password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
      - name: Package and sign update
        id: package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
          NOTARY_KEY_FILE: ${{ runner.temp }}/notary.p8
          RELEASE_WORK_DIR: ${{ runner.temp }}/memonta-release
        run: |
          bash Scripts/release_direct.sh "$DISTRIBUTION_MODE"
      - name: Upload complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          gh release create "$RELEASE_TAG" "$DIRECTORY"/*.zip "$DIRECTORY/appcast.xml" "$DIRECTORY/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Memonta $RELEASE_TAG" --notes-file "$DIRECTORY"/*.md
          echo "${DISTRIBUTION_MODE} 草稿附件已上传。发布后将更新唯一的 stable 频道。"
      - name: Clean signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/memonta-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
