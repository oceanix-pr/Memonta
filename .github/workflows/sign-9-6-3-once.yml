name: Sign the approved 9.6.3 archive once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memonta-direct-release
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'oceanix-pr/Memonta'
    runs-on: macos-15
    environment: release
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch only the approved draft archive and notes
        shell: bash
        run: |
          test "$(gh release view v9.6.3 --repo oceanix-pr/Memonta --json isDraft --jq .isDraft)" = true
          gh release download v9.6.3 --repo oceanix-pr/Memonta \
            --pattern Memonta-v9.6.3-147-macOS.zip --pattern Memonta-v9.6.3-147-macOS.md \
            --dir "$RUNNER_TEMP/updates"
          printf '%s  %s\n' aeb3d033f2d473619eb002b9aeee5428ef2ce3d0ac4d468329dad61cc789e57f \
            "$RUNNER_TEMP/updates/Memonta-v9.6.3-147-macOS.zip" | shasum -a 256 -c -
          printf '%s  %s\n' 2fa1b11cc14b4d988e0fc7ba7334b2efc6bfe19183b64b68179305c49384f8b2 \
            "$RUNNER_TEMP/updates/Memonta-v9.6.3-147-macOS.md" | shasum -a 256 -c -
      - name: Verify the pinned official Sparkle signing tool
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-for-Swift-Package-Manager.zip \
            --output "$RUNNER_TEMP/Sparkle.zip"
          printf '%s  %s\n' 17e28312b8e18ab7cdbbe09a6fb28cc55a5479ec6c371dbc07cdecd2a14fd959 \
            "$RUNNER_TEMP/Sparkle.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/Sparkle.zip" "$RUNNER_TEMP/sparkle"
      - name: Sign the fixed archive without exporting the key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          signer="$(find "$RUNNER_TEMP/sparkle" -path '*/bin/generate_appcast' -type f -print -quit)"
          test -x "$signer"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$signer" --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix https://github.com/oceanix-pr/Memonta/releases/download/v9.6.3/ \
            --embed-release-notes "$RUNNER_TEMP/updates"
          (cd "$RUNNER_TEMP/updates" && shasum -a 256 Memonta-v9.6.3-147-macOS.zip appcast.xml > SHA256SUMS)
      - name: Attach metadata only while the release is a draft
        shell: bash
        run: |
          test "$(gh release view v9.6.3 --repo oceanix-pr/Memonta --json isDraft --jq .isDraft)" = true
          gh release upload v9.6.3 --repo oceanix-pr/Memonta \
            "$RUNNER_TEMP/updates/appcast.xml" "$RUNNER_TEMP/updates/SHA256SUMS"
